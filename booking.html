
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav>

            <h1>IPL 2026</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#matches">Matches</a>
                <a href="booking.html">Book Ticket</a>
                <a href="index.html#mybookings">My Bookings</a>
                <a href="index.html#guidelines">Guidelines</a>
            </div>

        </nav>
    </header>

    <main>

        <!-- Booking Form Section -->
        <section class="content-section booking-page">

            <h2>IPL Ticket Booking Form</h2>

            <p>
                Enter your personal details and select your
                preferred IPL match to book your tickets.
            </p>

            <form action="#" method="get">

                <!-- Personal Details -->
                <h3>Personal Details</h3>

                <label for="name">Full Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="3"
                    maxlength="40"
                    required
                >

                <label for="email">Email Address:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone Number:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10 digit phone number"
                    pattern="[0-9]{10}"
                    minlength="10"
                    maxlength="10"
                    title="Please enter exactly 10 digits"
                    required
                >

                <!-- Match Details -->
                <h3>Match Details</h3>

                <label for="match">Select Match:</label>

                <select id="match" name="match" required>

                    <option value="">Choose Match</option>

                    <option value="RCB vs CSK">
                        RCB vs CSK
                    </option>

                    <option value="MI vs KKR">
                        MI vs KKR
                    </option>

                    <option value="CSK vs SRH">
                        CSK vs SRH
                    </option>

                    <option value="KKR vs RCB">
                        KKR vs RCB
                    </option>

                </select>

                <label for="stand">Stand Category:</label>

                <select id="stand" name="stand" required>

                    <option value="">Choose Stand</option>

                    <option value="General">General</option>

                    <option value="Premium">Premium</option>

                    <option value="VIP">VIP</option>

                </select>

                <label for="quantity">Number of Tickets:</label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="10"
                    required
                >

                <!-- Additional Preferences -->
                <h3>Additional Preferences</h3>

                <fieldset class="preferences">

                    <legend>Preferred Seating:</legend>

                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="Near Boundary"
                        >
                        Near Boundary
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="Near Pavilion"
                        >
                        Near Pavilion
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="preference"
                            value="No Preference"
                            checked
                        >
                        No Preference
                    </label>

                </fieldset>

                <!-- Form Buttons -->
                <div class="form-actions">

                    <button type="submit">
                        Submit Booking
                    </button>

                    <button type="reset" class="reset-btn">
                        Reset Form
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 IPL Ticket Booking.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
